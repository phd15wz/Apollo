name: document-processor-agent
display_name: Document Processor
description: |
  Agent that ingests documents (PDF, DOCX), extracts text, runs OCR when necessary,
  and produces structured summaries and metadata.

inputs:
  - document_path: string
  - output_format: string  # e.g. "json", "markdown"

outputs:
  - summary_path: string
  - metadata_path: string

skills:
  - skills/document_processor.py

tools:
  - name: ocr-service
    type: cli
    description: Local OCR or external API wrapper

notes: |
  - Template agent. Connect `ocr-service` and replace placeholder skill implementations.
